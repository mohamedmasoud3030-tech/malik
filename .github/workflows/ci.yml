name: CI / Typecheck, Lint & Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VITE_SUPABASE_URL: https://example.supabase.co
      VITE_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Governance guard
        run: |
          bash scripts/check-production-mutation-guard.sh
          node scripts/check-manual-migration-workflow.mjs
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
      # Keep install deterministic and block arbitrary package lifecycle scripts.
      # esbuild is the only approved native toolchain package that needs its binary shim rebuilt.
      - name: Install dependencies with lifecycle scripts disabled
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Rebuild approved native toolchain package
        run: pnpm rebuild esbuild
      - run: pnpm supabase:migration-evidence
      - name: Run documentation link check
        id: docs-links
        shell: bash
        run: |
          set +e
          pnpm check:docs > /tmp/rentrix-doc-links.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat /tmp/rentrix-doc-links.log
          exit 0
      - name: Upload documentation link diagnostics
        if: steps.docs-links.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rentrix-doc-link-diagnostics
          path: /tmp/rentrix-doc-links.log
      - name: Fail on broken documentation links
        if: steps.docs-links.outputs.status != '0'
        run: exit 1
      - name: Run typecheck
        id: typecheck
        shell: bash
        run: |
          set +e
          pnpm typecheck > /tmp/rentrix-typecheck.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 200 /tmp/rentrix-typecheck.log
          exit 0
      - name: Upload typecheck diagnostics
        if: steps.typecheck.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rentrix-typecheck-diagnostics
          path: /tmp/rentrix-typecheck.log
      - name: Fail on typecheck errors
        if: steps.typecheck.outputs.status != '0'
        run: exit 1
      - run: pnpm lint
      - name: Run architecture check
        run: pnpm --filter ./rentrix-app run check:architecture
      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: https://nnggcnpcuomwfuupupwg.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_JeLckFV2xYl78rei1-Q_EA_WcHif6WW
        run: pnpm build
      # Confirms finance hub lazy loading survives in the built output: source
      # can keep saying lazy() while the bundler inlines every section.
      - name: Verify finance hub code splitting
        run: pnpm --filter ./rentrix-app run check:finance-bundles
      - run: pnpm --filter ./rentrix-app run typecheck:test
      - name: Run full application tests
        id: full-tests
        shell: bash
        run: |
          set +e
          pnpm --filter ./rentrix-app test > /tmp/rentrix-full-tests.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 220 /tmp/rentrix-full-tests.log
          exit 0
      - name: Upload full test diagnostics
        if: steps.full-tests.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rentrix-full-test-diagnostics
          path: /tmp/rentrix-full-tests.log
      - name: Fail on full test errors
        if: steps.full-tests.outputs.status != '0'
        run: exit 1
      - name: Run financial tests
        id: financial-tests
        shell: bash
        run: |
          set +e
          pnpm --filter ./rentrix-app run test:financials > /tmp/rentrix-financial-tests.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 160 /tmp/rentrix-financial-tests.log
          exit 0
      - name: Upload financial test diagnostics
        if: steps.financial-tests.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rentrix-financial-test-diagnostics
          path: /tmp/rentrix-financial-tests.log
      - name: Fail on financial test errors
        if: steps.financial-tests.outputs.status != '0'
        run: exit 1
